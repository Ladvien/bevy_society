# CI for bevy_society (canonical repository).
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env: { RUSTDOCFLAGS: "-D warnings" }
  build:
    name: build (standalone) + test
    needs: lint
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Plain `cargo build` takes no dev-dependencies, so it compiles exactly the bevy features a
      # consumer gets; the full-umbrella dev-dependency would hide a hole in the trimmed list.
      - run: cargo build
      - run: cargo build --no-default-features
      - run: cargo test
      - run: cargo test --no-default-features
      # The save feature's own tests: `capture`/`restore` and their derives are off by default, so
      # without this line nothing would compile them in CI.
      - run: cargo test --features serde
      # `tests/rumor_book.rs` is release-only: it lives in a village for twenty-two game-days with 200
      # people, which is 4 m 26 s in a debug build and 33 s optimised. It measures a performance
      # property, so an optimised build is also the only build where the measurement means anything.
      - run: cargo test --release --test rumor_book
      # Release-only like `rumor_book`: the friendship bound is a measurement over 60 people and 30
      # game-days, which is minutes in a debug build, and an optimised build is the only one where the
      # measurement means anything.
      - run: cargo test --release --test friendship_bound
      # Examples need a font at run time, so building them is the check that fits in CI.
      - run: cargo build --examples
