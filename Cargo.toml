[package]
name = "bevy_society"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Living societies for Bevy: personalities, moods, needs, memories, relationships, opinions, rumors, reputation and factions; utility-AI daily lives; Rhai triggers; dialogue through bevy_speech_bubbles."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_society"
keywords = ["bevy", "gamedev", "ai", "simulation", "npc"]
categories = ["game-development", "simulation"]
publish = false   # its ladvien dependencies are publish = false git dependencies

[features]
default = ["dialogue", "steering", "fields"]
steering = ["dep:bevy_orca"]
fields = ["dep:bevy_stigmergy"]
dialogue = ["dep:bevy_speech_bubbles"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["bevy_log", "std"] }  # https://github.com/bevyengine/bevy — the engine
rhai = { version = "1.27", features = ["sync", "f32_float"] }                            # https://github.com/rhaiscript/rhai — the trigger and effect scripts
serde = { version = "1", features = ["derive"] }                                         # https://github.com/serde-rs/serde — authored definitions
ron = "0.12"                                                                             # https://github.com/ron-rs/ron — the definitions' file format
rand_chacha = "0.10"   # https://github.com/rust-random/rand — names ChaCha8Rng; the stream comes from bevy_emerge_rng
# The ladvien dependencies are crates.io versions rather than git revs, so a consumer needs no
# `[patch]` and the whole family can be published. They move together: `bevy_orca` and
# `bevy_stigmergy` are 0.2, which is the interface release that added `Crowd` and `CellFrame`.
bevy_emerge_rng = "0.1"                                                                  # https://github.com/Ladvien/bevy_emerge — the seeded ChaCha8 stream and DetRng draws
bevy_orca = { version = "0.2", optional = true }                                          # https://github.com/Ladvien/bevy_orca — ORCA reciprocal collision avoidance for walking persons (steering feature)
bevy_stigmergy = { version = "0.2", optional = true, features = ["reflect"] }             # https://github.com/Ladvien/bevy_stigmergy — per-cell presence and commotion fields (fields feature)
bevy_speech_bubbles = { version = "0.2", optional = true }                                # https://github.com/Ladvien/bevy_speech_bubbles — barks and conversations (dialogue feature)

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "evidence"
path = "examples/evidence.rs"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "capture"
path = "examples/capture.rs"

[[example]]
name = "village"
path = "examples/village.rs"
required-features = ["dialogue"]

[dev-dependencies]
bevy = { version = "0.20.0" }                                                            # full umbrella, examples/tests only
bevy_fairy = { git = "https://github.com/Ladvien/bevy_fairy", rev = "04d120e729affdac4cf592b8894c71ff1b8e031e", default-features = false, features = ["plugin"] }  # https://github.com/Ladvien/bevy_fairy — the agentic debugger in the village example
serde_json = "1"                                                                         # https://github.com/serde-rs/json — the example's debug-command payloads

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[package.metadata.docs.rs]
all-features = true

[profile.dev.package."*"]
opt-level = 3

