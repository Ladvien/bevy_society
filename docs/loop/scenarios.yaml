# The scenarios the loop runs. Every iteration measures against these, so a change that fixes one
# cannot quietly break another.
#
# Each scenario is a fixed seed, population and settings override, a tick budget, and the observable
# it should produce. `observable` is what a test asserts and what an iteration's evidence must show.
#
# `kind` says how to build it:
#   persons  — N named persons at the given positions
#   village  — the F1 village: four places, 24 villagers in three factions of eight
#   cluster  — two groups far apart in the same society, so a rumor must cross a gap
#
# `positions` is either a grid (`grid: {cols, rows, spacing}`) or an explicit list.
# A scenario with `status: pending` has no test yet; the loop may not claim it passes.

scenarios:
  - name: need-cycle
    kind: persons
    seed: 7
    population: 8
    settings: { seconds_per_day: 64.0, start_hour: 7.0 }
    ticks: 5000
    status: measured
    test: tests/need_cycle.rs
    observable: >
      Every person's needs are **met and re-met**: over the run each need both falls below 0.7 and
      recovers above it, and no need is ever left falling with no activity to satisfy it. What cycles
      depends on the rates, and the rates are data — so the test records which needs cycle per seed
      rather than asserting a fixed list.
      (Restated 2026-12-06 from measurement, and `measured` for the first time. The old observable said
      "**`rest` and `food`** fall and rise again over a game-day: each crosses below 0.35 and recovers
      above 0.7". `rest` does not cross 0.35 at **any** seed, and cannot: `sleep` restores
      `0.15/game-hour × 8 h = 1.20` against a `rest` decay of `0.70/day`, a net `+0.50` per sleep, so it
      ratchets up until sleeping stops being chosen and never needs to run low. That is the supply
      working, not a defect. Measured per person at 64 s/day over 80 000 ticks: `food` cycles **8 of 8**
      at seeds 7 and 42, `fun` **8 and 6 of 8**, `social` **0 and 2 of 8**, `rest` **0 of 0** — see
      `tests/need_cycle.rs`.)
      (Corrected 2026-11-18. The previous note claimed "all four needs cycle", citing means
      [0.86, 0.81, 0.58, 0.79]. That was false, and it was false for a mechanical reason: the evidence
      series recorded a row at **tick 0**, before `size_person_state` fills `Needs`, so every need read
      0.000 once. That single row made "crosses below 0.35" true of the mean while **no individual ever
      came close**. Measured per person over 80 000 ticks, and again from the series with tick 0 removed:
      `social` bottoms at 0.61, `rest` at 0.54, `fun` at 0.56 — none crosses 0.35 — and only `food`
      cycles, once a day, 0.22 → 1.00. That is correct behaviour: those three needs are met well enough
      that they never run low, which is a fact about the rates, not a defect.)

  - name: rumor-crosses-a-cluster
    kind: cluster
    seed: 11
    population: 12
    settings: { seconds_per_day: 64.0, start_hour: 15.0, contact_radius: 4.0, travel_timeout_hours: 12.0 }
    ticks: 1200
    status: pending
    test: tests/cluster_reach.rs
    observable: >
      With the two groups 40 m apart and one person from each group brought together once, a rumor
      planted in the first group reaches at least 40% of the second group. Zero reach means gossip
      cannot cross a gap; instant reach means it teleports.
      (Measured 2026-12-07: **0 of 6 at 64 s/day and 0 of 6 at 240**, over the same game-days. Every
      layer was checked and works — steering walks at 1.4 m/s, 359 948 person-ticks of movement, a bridge
      place chosen for 36 489, 6 720 ticks arrived, 434 ticks with both groups arrived, and one person
      seeing two of the other group at **2.89 m** — and the count of cross-group interactions is **0**.
      The cause: **an exchange fires on *arrival*, once.** Two people placed together in the smallest case
      give 39 interactions over 20 000 ticks, so the mechanism is sound; but a pair that arrives at tick
      100 and tick 500 shares 400 ticks of standing together and shares no arrival. They arrive hours
      apart by construction, because a 20 m walk is 5.4 game-hours against a 0.75-hour activity. The crate
      can see the groups and cannot exchange between them. `tests/cluster_reach.rs` pins the measurement so
      the scenario cannot be marked `measured` on a number nobody checked, and
      `needs-decision/how-can-two-groups-ever-meet.md` records the three options.)
      (Measured 2026-11-20: **0.333 at a 12-hour travel timeout and 0.167 at 20** — both below the 40%
      this asks for, and the earlier 0.583 was recorded before `contact_radius` was being applied, so it
      was a different run. The scenario is `pending` until the crossing works or the observable is
      re-stated. The gap is the design question: two groups 40 m apart need a 10.7 game-hour walk, so
      either the gap is smaller, the timeout longer than a day, or a bridge activity exists.)

  - name: opinion-converges-but-not-entirely
    kind: persons
    seed: 3
    population: 10
    settings: { seconds_per_day: 64.0 }
    ticks: 12000
    status: measured
    test: tests/opinion_convergence.rs
    observable: >
      Opinion spread on one topic narrows over the run but does not collapse to a single value:
      standard deviation falls by at least a fifth and stays above 0.02. Full collapse means the
      confidence bound is not being respected. Measured 2026-10-25 under the affinity clamp: 0.5106
      to 0.3967 at 12 000 ticks (22.3%), against 0.3699 (27.6%) before the clamp. The bar moved from
      a third to a fifth because the clamp lowers every Deffuant and conformity weight the model
      applies, so the same pull moves opinions less; the no-collapse half is unchanged.

  - name: deed-draws-a-response
    kind: persons
    seed: 5
    population: 6
    settings: { seconds_per_day: 64.0 }
    ticks: 400
    status: measured
    test: tests/deed_response.rs
    observable: >
      One accepted deed with four witnesses in perception produces exactly one rumor, every witness
      knows it, and each witness whose approval `norm * sign(harm)` is below -0.5 raises one
      `NormViolated`. Two rumors or zero witnesses means the deed path is wrong.
      (Corrected 2026-11-07: this said "a witness whose opinion on the deed's topic is below -0.5",
      but the crate judges `approval`, not the raw opinion, and a planted `PlantRumor` is a rumor,
      not a deed — `witness()` only runs on an accepted interaction that names one.)

  - name: village-evening
    kind: village
    seed: 7
    population: 24
    settings: { seconds_per_day: 64.0, start_hour: 15.0, travel_timeout_hours: 4.0 }
    ticks: 4200
    status: measured
    observable: >
      The hero-GIF scenario: ties form (at least three friendships and one rivalry), a rumor planted at
      tick 300 is **told to at least one other person**, and at least six barks are written. This is the
      one scenario whose numbers the README's clip depends on.
      (Corrected 2026-12-05: **the harness does not plant at tick 300.** `examples/evidence.rs::plant_at`
      scales the authored 560 by `seconds_per_day / 4`, which is **8 960** at this scenario's 64 s/day —
      560 was authored against the old four-second harness day. Measured at 300, the condition holds at
      **7 of 7 seeds** (reaching 2-8 villagers); at 8 960 it holds at 8 of 10. The two ticks are now stated
      here so neither is mistaken for the other, and `tests/village_evening.rs` asserts the condition at
      300 across seven seeds. The condition also counts **villagers**, not `PersonIndex`: the player is a
      `Person` without `Autonomous` and never gossips, so a rumor that reached only the player has died.)
      (Corrected 2026-11-16: this asked for the rumor to reach **half the village**. Measured over 17
      game-days at this scenario's own settings, the village creates about **18 rumours a day** — a deed
      every few minutes — and `best_telling` correctly prefers the strongest, freshest one each time. A
      planted rumor is told (known_by 1 → 2, measured) and is then out-competed by later, stronger ones,
      which is Daley–Kendall working rather than failing. Reaching half a village would need the rumor to
      stay the most salient thing in it for days, which a village this busy never allows. The reach
      figure is still recorded; it is no longer the pass condition.)

  - name: determinism
    kind: village
    seed: 7
    population: 24
    settings: { seconds_per_day: 64.0, start_hour: 15.0 }
    ticks: 3000
    status: measured
    test: tests/determinism.rs
    observable: >
      Two runs with seed 7 hash identically and a run with seed 8 does not. `tests/determinism.rs`
      holds this: `the_same_seed_gives_the_same_society` and `a_different_seed_gives_a_different_society`.
      (Corrected 2026-11-07: this said the test was waiting on `BehaviorPlugin`'s per-tick draws. Those
      landed; both tests have been green for several iterations and the status was never updated.)

  - name: scale-1000
    kind: persons
    seed: 1
    population: 1000
    settings: { seconds_per_day: 240.0 }
    ticks: 400
    status: measured
    observable: >
      Cost per society tick at 1,000 persons, recorded in the iteration's `perf.md`. Report it as
      milliseconds per tick, not as a pass/fail. Measured 2026-11-26-01 (uniform grid for
      perception): **13.5 ms** per tick at 1,000 persons (0.90 ms amortised per 60 fps frame),
      0.59 ms at 100, 49.9 ms at 2,000, 245.1 ms at 5,000.
      (Corrected 2026-11-26. The note used to say perception's all-pairs scan was the quadratic
      term. Measured with direct timers at 5,000 people it is 36 ms of a ~320 ms fixed step — about
      12%. The term that scales is scoring every `Person`-targeted activity against every neighbour:
      182 neighbours at that density, so ~3.6M consideration evaluations a tick. See
      `runs/2026-11-26-01/perf.md`.)
