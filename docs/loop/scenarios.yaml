# The scenarios the loop runs. Every iteration measures against these, so a change that fixes one
# cannot quietly break another.
#
# Each scenario is a fixed seed, population and settings override, a tick budget, and the observable
# it should produce. `observable` is what a test asserts and what an iteration's evidence must show.
#
# `kind` says how to build it:
#   persons  — N named persons at the given positions
#   village  — the F1 village: four places, 24 villagers in three factions of eight
#   cluster  — two groups far apart in the same society, so a rumor must cross a gap
#
# `positions` is either a grid (`grid: {cols, rows, spacing}`) or an explicit list.
# A scenario with `status: pending` has no test yet; the loop may not claim it passes.

scenarios:
  - name: need-cycle
    kind: persons
    seed: 7
    population: 8
    settings: { seconds_per_day: 64.0, start_hour: 7.0 }
    ticks: 5000
    status: pending
    test: tests/need_cycle.rs
    observable: >
      Every person's `rest` and `food` needs fall and rise again over a game-day: each crosses below
      0.35 at least once and recovers above 0.7 at least once. A need that only ever falls means no
      activity ever satisfies it.
      (Corrected 2026-11-18. The previous note claimed "all four needs cycle", citing means
      [0.86, 0.81, 0.58, 0.79]. That was false, and it was false for a mechanical reason: the evidence
      series recorded a row at **tick 0**, before `size_person_state` fills `Needs`, so every need read
      0.000 once. That single row made "crosses below 0.35" true of the mean while **no individual ever
      came close**. Measured per person over 80 000 ticks, and again from the series with tick 0 removed:
      `social` bottoms at 0.61, `rest` at 0.54, `fun` at 0.56 — none crosses 0.35 — and only `food`
      cycles, once a day, 0.22 → 1.00. That is correct behaviour: those three needs are met well enough
      that they never run low, which is a fact about the rates, not a defect.)

  - name: rumor-crosses-a-cluster
    kind: cluster
    seed: 11
    population: 12
    settings: { seconds_per_day: 64.0, start_hour: 15.0, contact_radius: 4.0, travel_timeout_hours: 20.0 }
    ticks: 1200
    status: measured
    observable: >
      With the two groups 40 m apart and one person from each group brought together once, a rumor
      planted in the first group reaches at least 40% of the second group. Zero reach means gossip
      cannot cross a gap; instant reach means it teleports.

  - name: opinion-converges-but-not-entirely
    kind: persons
    seed: 3
    population: 10
    settings: { seconds_per_day: 64.0 }
    ticks: 12000
    status: measured
    test: tests/opinion_convergence.rs
    observable: >
      Opinion spread on one topic narrows over the run but does not collapse to a single value:
      standard deviation falls by at least a third and stays above 0.02. Full collapse means the
      confidence bound is not being respected.

  - name: deed-draws-a-response
    kind: persons
    seed: 5
    population: 6
    settings: { seconds_per_day: 64.0 }
    ticks: 400
    status: measured
    test: tests/deed_response.rs
    observable: >
      One accepted deed with four witnesses in perception produces exactly one rumor, every witness
      knows it, and each witness whose approval `norm * sign(harm)` is below -0.5 raises one
      `NormViolated`. Two rumors or zero witnesses means the deed path is wrong.
      (Corrected 2026-11-07: this said "a witness whose opinion on the deed's topic is below -0.5",
      but the crate judges `approval`, not the raw opinion, and a planted `PlantRumor` is a rumor,
      not a deed — `witness()` only runs on an accepted interaction that names one.)

  - name: village-evening
    kind: village
    seed: 7
    population: 24
    settings: { seconds_per_day: 64.0, start_hour: 15.0, travel_timeout_hours: 20.0 }
    ticks: 4200
    status: measured
    observable: >
      The hero-GIF scenario: ties form (at least three friendships and one rivalry), a rumor planted at
      tick 300 is **told to at least one other person**, and at least six barks are written. This is the
      one scenario whose numbers the README's clip depends on.
      (Corrected 2026-11-16: this asked for the rumor to reach **half the village**. Measured over 17
      game-days at this scenario's own settings, the village creates about **18 rumours a day** — a deed
      every few minutes — and `best_telling` correctly prefers the strongest, freshest one each time. A
      planted rumor is told (known_by 1 → 2, measured) and is then out-competed by later, stronger ones,
      which is Daley–Kendall working rather than failing. Reaching half a village would need the rumor to
      stay the most salient thing in it for days, which a village this busy never allows. The reach
      figure is still recorded; it is no longer the pass condition.)

  - name: determinism
    kind: village
    seed: 7
    population: 24
    settings: { seconds_per_day: 64.0, start_hour: 15.0 }
    ticks: 3000
    status: measured
    test: tests/determinism.rs
    observable: >
      Two runs with seed 7 hash identically and a run with seed 8 does not. `tests/determinism.rs`
      holds this: `the_same_seed_gives_the_same_society` and `a_different_seed_gives_a_different_society`.
      (Corrected 2026-11-07: this said the test was waiting on `BehaviorPlugin`'s per-tick draws. Those
      landed; both tests have been green for several iterations and the status was never updated.)

  - name: scale-1000
    kind: persons
    seed: 1
    population: 1000
    settings: { seconds_per_day: 240.0 }
    ticks: 400
    status: measured
    observable: >
      Cost per society tick at 1,000 persons, recorded in the iteration's `perf.md`. Perception is
      brute force and quadratic, so this number is what a host is buying. Report it as
      milliseconds per tick, not as a pass/fail. Measured 2026-10-31-01: 14.1 ms per tick at 1,000
      persons (0.83 ms amortised per 60 fps frame), 0.55 ms at 100, 351 ms at 5,000.
